<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodieFlow Mobile App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-gray-900 text-white font-sans antialiased pb-20">

    <header class="sticky top-0 z-50 bg-gray-800/90 backdrop-blur-md border-b border-gray-700 p-4 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-utensils text-orange-500 text-xl"></i>
            <h1 class="text-xl font-bold tracking-wide">FoodieFlow</h1>
        </div>
        <div id="authStatus" class="text-sm">
            <button onclick="openAuthModal()" class="bg-orange-500 hover:bg-orange-600 text-white px-3 py-1.5 rounded-full text-xs font-semibold">Sign In</button>
        </div>
    </header>

    <main class="p-4 max-w-md mx-auto">
        <div class="mb-4">
            <h2 class="text-2xl font-extrabold">Delicious Dishes</h2>
            <p class="text-gray-400 text-sm">Order fresh food directly from your mobile</p>
        </div>

        <div id="menuContainer" class="grid grid-cols-1 gap-4">
            <div class="text-center py-8 text-gray-500">Loading menu...</div>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-gray-800 border-t border-gray-700 flex justify-around py-3 text-gray-400 z-50 max-w-md mx-auto">
        <button class="flex flex-col items-center text-orange-500">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-xs mt-1">Home</span>
        </button>
        <button class="flex flex-col items-center hover:text-white relative" onclick="openCart()">
            <i class="fa-solid fa-cart-shopping text-lg"></i>
            <span class="text-xs mt-1">Cart</span>
            <span id="cartBadge" class="absolute -top-1 -right-2 bg-orange-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
        </button>
        <button class="flex flex-col items-center hover:text-white" onclick="openAuthModal()">
            <i class="fa-solid fa-user text-lg"></i>
            <span class="text-xs mt-1">Account</span>
        </button>
    </nav>

    <div id="authModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-gray-800 w-full max-w-sm rounded-2xl p-6 border border-gray-700 shadow-2xl relative">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <h3 class="text-xl font-bold mb-4" id="modalTitle">Login to Account</h3>
            
            <form id="authForm" class="space-y-4">
                <div>
                    <label class="text-xs text-gray-400">Username</label>
                    <input type="text" id="usernameInput" required class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2 text-white focus:outline-none focus:border-orange-500">
                </div>
                <div id="emailGroup" class="hidden">
                    <label class="text-xs text-gray-400">Email</label>
                    <input type="email" id="emailInput" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2 text-white focus:outline-none focus:border-orange-500">
                </div>
                <div>
                    <label class="text-xs text-gray-400">Password</label>
                    <input type="password" id="passwordInput" required class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2 text-white focus:outline-none focus:border-orange-500">
                </div>
                <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 rounded-lg text-sm transition">Submit</button>
            </form>
            <p class="text-xs text-gray-400 mt-4 text-center">
                <span id="toggleText">Need an account?</span> 
                <a href="#" onclick="toggleAuthMode()" class="text-orange-400 underline font-semibold" id="toggleBtn">Register</a>
            </p>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
