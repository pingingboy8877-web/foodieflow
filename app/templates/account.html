<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account — FoodieFlow</title><link rel="stylesheet" href="/static/css/style.css"></head><body><header class="topbar"><div class="container" style="width:100%;display:flex;justify-content:space-between;align-items:center"><a class="brand" href="/"><span class="brand-mark">F</span><span>FoodieFlow<small>Food · Fast · Local</small></span></a><a class="ghost-btn" href="/">Discover food</a></div></header><main class="section"><div class="container" style="max-width:900px"><div class="eyebrow">Account</div><h1 class="section-title" style="font-size:46px">Your FoodieFlow.</h1><div id="accountContent" class="form-card" style="margin-top:25px"></div></div></main><script src="/static/js/app.js"></script><script>document.addEventListener("DOMContentLoaded", async()=>{const box=document.getElementById("accountContent"),u=JSON.parse(localStorage.getItem("foodieflow_user")||"null"),t=localStorage.getItem("foodieflow_token");if(!u||!t){box.innerHTML="<h3>You're not signed in.</h3><p class='section-sub'>Return home and sign in before checking your orders.</p><a class='primary-btn' style='display:inline-block;margin-top:15px' href='/'>Go to FoodieFlow</a>";return;}const r=await fetch("/api/orders/my-orders",{headers:{Authorization:"Bearer "+t}});const d=await r.json();box.innerHTML="<div style='display:flex;justify-content:space-between;gap:20px;align-items:center'><div><strong style='font-size:20px'>Hi, "+u.username+"</strong><p class='section-sub'>"+u.email+"</p></div><button class='ghost-btn' onclick='logout()'>Sign out</button></div><hr style='border:0;border-top:1px solid var(--line);margin:25px 0'><h3>Order history</h3>"+(d.orders?.length?d.orders.map(o=>"<div style='padding:15px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between'><span>Order #"+o.id+"<small style='display:block;color:var(--muted);margin-top:4px'>"+o.status+" · "+o.created_at+"</small></span><strong>"+money(o.total_amount)+"</strong></div>").join(""):"<p class='section-sub'>No orders yet. Your first one is waiting.</p>");});</script></body></html>
