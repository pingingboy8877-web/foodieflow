<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account - FoodieFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-gray-900 text-white font-sans antialiased pb-24">

    <header class="sticky top-0 z-50 bg-gray-800/90 backdrop-blur-md border-b border-gray-700 p-4">
        <h1 class="text-xl font-bold tracking-wide">My Account</h1>
    </header>

    <main class="p-4 max-w-md mx-auto space-y-6">
        <!-- User Details Card -->
        <div id="profileCard" class="bg-gray-800 border border-gray-700 rounded-xl p-4 flex items-center space-x-4">
            <div class="w-14 h-14 bg-orange-500/20 rounded-full flex items-center justify-center text-orange-400 text-2xl font-bold">
                <i class="fa-solid fa-user"></i>
            </div>
            <div>
                <h2 id="profileName" class="text-lg font-bold">Guest User</h2>
                <p id="profileEmail" class="text-xs text-gray-400">Not logged in</p>
            </div>
        </div>

        <!-- Orders Section -->
        <div>
            <h3 class="text-lg font-bold mb-3">Order History</h3>
            <div id="ordersContainer" class="space-y-3">
                <div class="text-center py-6 text-gray-500 text-sm">Log in to view past orders.</div>
            </div>
        </div>

        <button id="logoutBtn" onclick="logout()" class="hidden w-full bg-red-500/20 hover:bg-red-500 text-red-400 hover:text-white border border-red-500 font-bold py-2.5 rounded-xl text-sm transition">
            Sign Out
        </button>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-gray-800 border-t border-gray-700 flex justify-around py-3 text-gray-400 z-50 max-w-md mx-auto">
        <a href="/" class="flex flex-col items-center hover:text-white">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-xs mt-1">Home</span>
        </a>
        <a href="/cart.html" class="flex flex-col items-center hover:text-white">
            <i class="fa-solid fa-cart-shopping text-lg"></i>
            <span class="text-xs mt-1">Cart</span>
        </a>
        <a href="/account.html" class="flex flex-col items-center text-orange-500">
            <i class="fa-solid fa-user text-lg"></i>
            <span class="text-xs mt-1">Account</span>
        </a>
        <a href="/about.html" class="flex flex-col items-center hover:text-white">
            <i class="fa-solid fa-circle-info text-lg"></i>
            <span class="text-xs mt-1">About</span>
        </a>
    </nav>

    <script src="/static/js/account.js"></script>
</body>
</html>
